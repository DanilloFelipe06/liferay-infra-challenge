# Exposes the app externally through the cluster's reverse proxy (Traefik,
# bundled with k3s) instead of exposing the Service directly (e.g. as a
# NodePort/LoadBalancer per-service), so a single, well-known entry point
# fronts every service in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: posts-api
  namespace: posts-api
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: posts-api
                port:
                  name: http
