apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: posts-api
  namespace: posts-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: posts-api
  minReplicas: 3
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # Avoid flapping: wait a few minutes of sustained low usage before
      # removing replicas.
      stabilizationWindowSeconds: 300
