# Default values for posts-api.

replicaCount: 3

image:
  repository: danillofelipe/posts-api-private
  tag: sha-45b52cc
  pullPolicy: IfNotPresent

# Name of a pre-existing `kubernetes.io/dockerconfigjson` Secret used to pull
# `image.repository` when it is a private registry. Create it with:
#   kubectl create secret docker-registry regcred \
#     --namespace <release-namespace> \
#     --docker-username=<user> --docker-password=<token>
# Leave as [] if the image repository is public.
imagePullSecrets:
  - name: regcred

app:
  port: 3000
  # WARNING: TypeORM schema auto-sync. Fine for this sample (which ships no
  # migrations), unsafe for a real production database — see chart README.
  synchronize: true

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  # Empty host = catch-all rule matching any Host header.
  host: ""
  annotations: {}

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Spreads replicas across failure domains so that, with 3+ replicas and 3
# AZs, losing one whole AZ still leaves the app serving traffic.
topologySpreadConstraints:
  zoneTopologyKey: topology.kubernetes.io/zone
  hostTopologyKey: kubernetes.io/hostname

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Progressive delivery via Argo Rollouts instead of a plain Deployment.
# Requires the Argo Rollouts controller/CRDs in the cluster (see
# gitops/argo-rollouts-install.md). Off by default so the chart stays
# installable with nothing but stock Kubernetes.
argoRollouts:
  enabled: false
  canary:
    steps:
      - setWeight: 33
        pauseSeconds: 30
      - setWeight: 66
        pauseSeconds: 30
      # Final implicit step to 100% happens automatically once all steps
      # above complete.

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 70

# --- Database -------------------------------------------------------------
# By default the chart deploys its own single-instance MariaDB (mariadb.*
# below) — convenient for local/demo use, but NOT how this should run in a
# real multi-AZ production environment (see chart README). Set
# database.embedded: false and fill in database.host/port to point at an
# externally managed database instead (e.g. RDS/Cloud SQL), which is the
# recommended production setup.
database:
  embedded: true
  host: ""
  port: 3306
  name: posts
  username: posts_app
  # Name of a pre-existing Secret with keys TYPEORM_USERNAME,
  # TYPEORM_PASSWORD, TYPEORM_DATABASE (and MYSQL_ROOT_PASSWORD when
  # database.embedded is true). If empty, the chart generates one Secret
  # with random credentials on first install and preserves it across
  # upgrades using Helm's `lookup` function.
  #
  # Set under GitOps (Argo CD): Argo CD's Helm rendering does not reliably
  # honor `lookup` across syncs, so a plain "generate on first install"
  # Secret can silently get a brand new random password on a later sync
  # while the already-provisioned MariaDB user keeps the old one — the app
  # then fails to connect. To avoid that class of bug, this Secret is
  # created out-of-band (same pattern as `imagePullSecrets` / regcred) and
  # referenced here by name; Helm/Argo CD never generate or touch it.
  #   kubectl create secret generic posts-api-db-credentials \
  #     --namespace <release-namespace> \
  #     --from-literal=TYPEORM_USERNAME=posts_app \
  #     --from-literal=TYPEORM_DATABASE=posts \
  #     --from-literal=TYPEORM_PASSWORD=<random> \
  #     --from-literal=MYSQL_ROOT_PASSWORD=<random>
  #
  # Gotcha when migrating an existing release to this: if a Secret with
  # this same name was previously generated (and applied) by this Helm
  # chart through Argo CD, it still carries Argo CD's tracking
  # label/annotation. `kubectl apply`/`create --dry-run=client -o yaml |
  # apply` on top of it can leave that tracking metadata in place even
  # though the object's contents changed — and since it then disappears
  # from the chart's rendered output (this guard turns the template off),
  # Argo CD's automated prune deletes it on the next sync, right out from
  # under you. Use plain `kubectl create secret` (or delete the old
  # object first) so the replacement starts with no Argo CD metadata at
  # all — `kubectl get secret posts-api-db-credentials -o
  # jsonpath='{.metadata.labels}{.metadata.annotations}'` should print
  # nothing.
  existingSecret: "posts-api-db-credentials"

mariadb:
  image: mariadb:10.11
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
