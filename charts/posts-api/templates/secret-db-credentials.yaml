{{- if not .Values.database.existingSecret }}
{{/*
Auto-generated DB credentials. `lookup` reuses whatever was generated on a
previous install so `helm upgrade` never rotates the password (which would
strand the already-provisioned MariaDB user/database).
*/}}
{{- $secretName := include "posts-api.dbSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posts-api.labels" . | nindent 4 }}
type: Opaque
data:
  TYPEORM_USERNAME: {{ .Values.database.username | b64enc }}
  TYPEORM_DATABASE: {{ .Values.database.name | b64enc }}
  TYPEORM_PASSWORD: {{ (and $existing (index $existing.data "TYPEORM_PASSWORD")) | default (randAlphaNum 24 | b64enc) }}
  MYSQL_ROOT_PASSWORD: {{ (and $existing (index $existing.data "MYSQL_ROOT_PASSWORD")) | default (randAlphaNum 24 | b64enc) }}
{{- end }}
